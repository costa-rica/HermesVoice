name: HermesVoice
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: HermesVoice
    PRODUCT_BUNDLE_IDENTIFIER: com.dashanddata.HermesVoice
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: HermesVoice/Config/Info.plist
    DEVELOPMENT_ASSET_PATHS: "\"HermesVoice/Preview Content\""
targets:
  HermesVoice:
    type: application
    platform: iOS
    sources:
      - path: HermesVoice
    settings:
      base:
        PRODUCT_MODULE_NAME: HermesVoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
  HermesVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesVoiceTests
    dependencies:
      - target: HermesVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: HermesVoiceTests
        PRODUCT_MODULE_NAME: HermesVoiceTests
        PRODUCT_BUNDLE_IDENTIFIER: com.dashanddata.HermesVoiceTests
schemes:
  HermesVoice:
    build:
      targets:
        HermesVoice: all
        HermesVoiceTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HermesVoiceTests
