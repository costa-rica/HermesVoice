# Nginx server blocks for maestro04
# Place in /etc/nginx/conf.d/hermes-voice.conf on maestro04

# Web app: hermes-voice.dashanddata.com
server {
    listen 80;
    server_name hermes-voice.dashanddata.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hermes-voice.dashanddata.com;

    # Certbot manages these lines:
    # ssl_certificate /etc/letsencrypt/live/hermes-voice.dashanddata.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hermes-voice.dashanddata.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limit login endpoint
    location /login {
        limit_req zone=strict burst=5 nodelay;
        proxy_pass http://192.168.0.244:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket voice endpoint, same-origin
    location /ws/ {
        proxy_pass http://192.168.0.244:8700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://192.168.0.244:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

# Optional: separate API subdomain — not active in the current same-origin deployment.
# api.hermes-voice.dashanddata.com has no TLS certificate; omit unless explicitly needed.
# api.hermes-voice.dashanddata.com
server {
    listen 80;
    server_name api.hermes-voice.dashanddata.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.hermes-voice.dashanddata.com;

    # Certbot manages these lines:
    # ssl_certificate /etc/letsencrypt/live/hermes-voice.dashanddata.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hermes-voice.dashanddata.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket voice endpoint
    location /ws/ {
        proxy_pass http://192.168.0.244:8700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://192.168.0.244:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
